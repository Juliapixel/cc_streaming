[package]
name = "cc_streaming"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
debug = "full"

[profile.release]
lto = "fat"
debug = "none"

[dependencies]
scuffle-ffmpeg = { git = "https://github.com/ScuffleCloud/scuffle", rev = "6057eef62004cb21541136f933068fc25ff7e44b" }
reqwest = { version = "0.12", features = ["brotli", "charset", "deflate", "gzip", "http2", "json", "rustls-tls"], default-features = false }
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
image = { version = "0.25" }
clap = { version = "4.5", features = ["derive"] }
once_cell = "1.19"
anyhow = "1.0"
palette = "0.7"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
either = "1.13"
kd-tree = "0.6"
futures = "0.3"
actix-web = "4.8"
actix-ws = "0.3"
actix = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5", features = ["serde"] }
bitvec = "1.0"
rand = "0.8"
fast_image_resize = { version = "5.1.0", features = ["image"] }
bytemuck = "1.21.0"
heapless = "0.8.0"
